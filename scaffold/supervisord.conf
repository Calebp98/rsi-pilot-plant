; The Sprite runs these as `sprite-env` services; in the Docker image supervisord does the same job.
; supervisord runs as root (so it can write the container's stdout) and starts every program as agent.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=root:agent

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:tap]
user=agent
environment=HOME="/home/agent",USER="agent"
command=python3 -u /home/agent/tap/tap.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
user=agent
environment=HOME="/home/agent",USER="agent"
command=/home/agent/dashboard/run-dashboard.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ttyd]
user=agent
environment=HOME="/home/agent",USER="agent"
command=/home/agent/dashboard/run-ttyd.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ttyd-view]
user=agent
environment=HOME="/home/agent",USER="agent"
command=/home/agent/dashboard/run-ttyd-view.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
user=agent
environment=HOME="/home/agent",USER="agent"
command=/home/agent/dashboard/run-caddy.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
