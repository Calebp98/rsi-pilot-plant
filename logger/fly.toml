# Lucid interaction logger + SSH gateway. See docs/deploy-fly.md.
# First time: fly launch --copy-config --no-deploy --name <your-logger-app>; then fly deploy --remote-only --ha=false.
# Secrets: CLIENT_KEYS, READ_TOKEN, ALLOWED_ORIGINS, SSH_CLIENT_KEYS, SSH_TARGETS, SSH_TARGET_HOSTKEYS,
#          TINFOIL_API_KEY, MODEL_CLIENT_TOKENS.
app = "your-logger-app"
primary_region = "lhr"

[build]

[mounts]
  source = "logger_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

# Command-only SSH gateway to the GPU server(s)
[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = "off"
  [[services.ports]]
    port = 2222

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
